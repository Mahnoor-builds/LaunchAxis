<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart - LaunchNext</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background-color: #0f0f0f;
      color: #f8f8f8;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #000;
      padding: 1rem 2rem;
    }

    .nav-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
    }

    .container {
      max-width: 700px;
      margin: 3rem auto;
      background-color: #1a1a1a;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #38bdf8;
    }

    .cart-items {
      margin-bottom: 2rem;
    }

    .cart-items li {
      border-bottom: 1px solid #333;
      padding: 0.6rem 0;
      display: flex;
      justify-content: space-between;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      padding: 0.8rem;
      margin-top: 0.4rem;
      background: #121212;
      border: 1px solid #444;
      border-radius: 6px;
      color: #f8f8f8;
    }

    .btn {
      margin-top: 1.5rem;
      background: #38bdf8;
      color: #0f172a;
      padding: 0.8rem 1.5rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
    }

    .btn:hover {
      background: #0ea5e9;
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-title">LaunchAxis</div>
  </nav>

  <div class="container">
    <h2>Your Cart</h2>

    <ul class="cart-items" id="cartItems">
      <!-- JS will inject items here -->
    </ul>

    <form id="checkoutForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="e.g. John Doe" required />

      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="e.g. john@example.com" required />

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="e.g. 03XX-XXXXXXX" required />

      <label for="city">City</label>
      <input type="text" id="city" placeholder="e.g. Lahore, Karachi" required />

      <label for="postal">Postal Code</label>
      <input type="text" id="postal" placeholder="e.g. 54000" required />

      <label for="address">Delivery Address</label>
      <textarea id="address" rows="3" placeholder="Street, area, building..." required></textarea>

      <label for="note">Note (Optional)</label>
      <textarea id="note" rows="2" placeholder="Any specific instructions..."></textarea>

      <button type="submit" class="btn">Confirm Order</button>
    </form>
  </div>

  <script>
    const cart = JSON.parse(localStorage.getItem("cartItems")) || [];

    function displayCart() {
      const container = document.getElementById("cartItems");
      if (cart.length === 0) {
        container.innerHTML = "<li>No items in your cart.</li>";
        return;
      }
      cart.forEach(item => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${item.name}</span><span>$${item.price}</span>`;
        container.appendChild(li);
      });
    }

    document.getElementById("checkoutForm").addEventListener("submit", function (e) {
      e.preventDefault();
      alert("Order confirmed! Your data will now be handled by Firebase.");
      // You can add Firebase saving logic here later
    });

    displayCart();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - LaunchAxis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background-color: #0f0f0f;
      color: #f8f8f8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 2rem;
    }

    .login-box {
      background: #1a1a1a;
      padding: 2.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: #38bdf8;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 0.9rem;
      margin-top: 0.4rem;
      background: #121212;
      border: 1px solid #444;
      border-radius: 6px;
      color: #f8f8f8;
    }

    .btn {
      margin-top: 2rem;
      background: #38bdf8;
      color: #0f172a;
      padding: 0.9rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
    }

    .btn:hover {
      background: #0ea5e9;
    }

    .text-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.95rem;
    }

    .text-link a {
      color: #38bdf8;
      text-decoration: none;
    }

    .text-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Welcome Back</h2>
    <form id="loginForm">
      <label for="email">Email Address</label>
      <input type="email" id="email" required placeholder="e.g. you@example.com" />

      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="Enter your password" />

      <button type="submit" class="btn">Login</button>
    </form>

    <div class="text-link">
      Don't have an account? <a href="usersignup.html">Sign Up here</a>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      alert("Login successful! Redirecting to dashboard...");
      // Redirect or validate with Firebase backend here
    });
  </script>

</body>
</html>

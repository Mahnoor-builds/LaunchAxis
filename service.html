<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Service Details - LaunchAxis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background-color: #ffffff;
      color: #111111;
      padding: 2rem;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .header h2 {
      font-size: 2rem;
      color: #0f172a;
    }

    .service-image {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 1.5rem;
    }

    .description {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: #333;
    }

    .price {
      font-weight: bold;
      font-size: 1.2rem;
      color: #38bdf8;
      margin-bottom: 2rem;
    }

    form {
      background-color: #f4f4f4;
      padding: 1.5rem;
      border-radius: 10px;
    }

    label {
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .btn {
      background-color: #38bdf8;
      color: #0f172a;
      padding: 0.8rem 1.5rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #0ea5e9;
    }

    .back-link {
      display: inline-block;
      margin-top: 2rem;
      color: #38bdf8;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2 id="serviceTitle">Service Title</h2>
    </div>

    <img id="serviceImage" class="service-image" src="https://via.placeholder.com/900x300?text=Service+Preview" alt="Service Image"/>

    <p class="description" id="serviceDescription">
      This is where the dynamic service description will appear. It can include key features and what the client will get.
    </p>

    <p class="price" id="servicePrice">$99</p>

    <form id="inquiryForm">
      <label>Your Name:</label>
      <input type="text" required placeholder="e.g. Ali Raza" />

      <label>Email:</label>
      <input type="email" required placeholder="e.g. you@example.com" />

      <label>What do you want in this service?</label>
      <textarea rows="4" placeholder="Describe your expectations..." required></textarea>

      <label>Attach file (optional):</label>
      <input type="file" />

      <button type="submit" class="btn">Submit Inquiry</button>
    </form>

    <a href="sevicewebpage.html" class="back-link">← Back to Services</a>
  </div>

  <script>
    // Example: Fetching data from URL (future use with Firebase)
    const params = new URLSearchParams(window.location.search);
    const serviceId = params.get("serviceId");

    // In real app, fetch data using this ID
    console.log("Requested serviceId:", serviceId);

    // Optional: Insert dynamic data here using Firebase later
    // document.getElementById("serviceTitle").innerText = ...;
    // document.getElementById("serviceDescription").innerText = ...;
    // document.getElementById("servicePrice").innerText = "$...";
    // document.getElementById("serviceImage").src = "image_url";
  </script>

</body>
</html>

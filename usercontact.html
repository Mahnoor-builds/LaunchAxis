<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - LaunchAxis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background-color: #0f0f0f;
      color: #f8f8f8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 2rem;
    }

    .signup-box {
      background: #1a1a1a;
      padding: 2.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: #38bdf8;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      padding: 0.9rem;
      margin-top: 0.4rem;
      background: #121212;
      border: 1px solid #444;
      border-radius: 6px;
      color: #f8f8f8;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .btn {
      margin-top: 2rem;
      background: #38bdf8;
      color: #0f172a;
      padding: 0.9rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
    }

    .btn:hover {
      background: #0ea5e9;
    }
  </style>
</head>
<body>

  <div class="signup-box">
    <h2>Contact Us</h2>
    <form id="contactForm">
      <label for="name">Your Name</label>
      <input type="text" id="name" required placeholder="e.g. Noor Ahmed" />

      <label for="email">Your Email</label>
      <input type="email" id="email" required placeholder="e.g. you@example.com" />

      <label for="message">Your Message</label>
      <textarea id="message" required placeholder="Write your message here..."></textarea>

      <button type="submit" class="btn">Send Message</button>
    </form>
  </div>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!name || !email || !message) {
        alert("Please fill in all fields.");
        return;
      }

      // 📩 Placeholder to integrate EmailJS or Firebase function
      alert("Your message has been sent! Thank you.");

      // Reset the form
      document.getElementById("contactForm").reset();
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | LaunchAxis</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: #030712; color: #FFFFFF; min-height: 100vh;
      display: flex; overflow-x: hidden;
    }

    .split-layout { display: flex; width: 100%; min-height: 100vh; }

    /* --- LEFT: FORM SIDE --- */
    .form-side {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      align-items: center; padding: 2rem; background: #030712; position: relative; z-index: 10;
    }
    .form-container { width: 100%; max-width: 400px; animation: fadeIn 0.6s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .brand-logo { font-size: 1.25rem; font-weight: 800; color: #fff; margin-bottom: 2rem; display: flex; align-items: center; gap: 8px; }
    .brand-logo i { color: #2dd4bf; }
    .form-header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.5rem; color: #f8fafc; }
    .form-header p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.5; }

    .google-btn {
      width: 100%; background-color: #fff; color: #0f172a; display: flex; align-items: center; justify-content: center; gap: 10px;
      border: 1px solid #e2e8f0; padding: 0.85rem; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease; margin-bottom: 1.5rem;
    }
    .google-btn:hover { background-color: #f8fafc; box-shadow: 0 4px 12px rgba(255,255,255,0.1); }
    .google-btn img { width: 20px; height: 20px; }

    .divider { display: flex; align-items: center; text-align: center; margin-bottom: 1.5rem; color: #475569; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #1e293b; }
    .divider:not(:empty)::before { margin-right: 1em; } .divider:not(:empty)::after { margin-left: 1em; }

    .input-group { margin-bottom: 1.2rem; }
    .input-group label { display: block; font-size: 0.75rem; font-weight: 700; color: #94a3b8; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
    
    input[type="email"], input[type="password"] {
      width: 100%; padding: 0.85rem 1rem; background-color: #0f172a; border: 1px solid #1e293b;
      border-radius: 8px; color: #f8fafc; font-size: 0.95rem; transition: all 0.2s ease;
    }
    input:focus { outline: none; border-color: #2dd4bf; background-color: #020617; box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.15); }

    .forgot-link { display: block; text-align: right; font-size: 0.8rem; color: #2dd4bf; margin-top: 0.5rem; text-decoration: none; font-weight: 600; transition: color 0.2s ease;}
    .forgot-link:hover { color: #f8fafc; text-decoration: underline; }

    .btn-primary {
      width: 100%; background: #2dd4bf; color: #020617; font-weight: 800; border: none; padding: 0.9rem; border-radius: 8px; font-size: 1rem;
      cursor: pointer; margin-top: 1.5rem; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover:not(:disabled) { background: #14b8a6; transform: translateY(-1px); box-shadow: 0 10px 20px rgba(45, 212, 191, 0.2); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .auth-footer { margin-top: 2rem; font-size: 0.9rem; color: #94a3b8; text-align: center; }
    .auth-footer a { color: #2dd4bf; text-decoration: none; font-weight: 600; transition: color 0.2s ease; }
    .auth-footer a:hover { color: #f8fafc; text-decoration: underline; }

    /* --- RIGHT: VISUAL SIDE --- */
    .visual-side {
      flex: 1.2; background: linear-gradient(135deg, #020617 0%, #0f172a 100%); position: relative;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 4rem; overflow: hidden; border-left: 1px solid rgba(255,255,255,0.05);
    }
    .cosmic-overlay { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 40px 40px; opacity: 0.5; }
    
    .planet {
      width: 300px; height: 300px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #2dd4bf, #0f172a 70%);
      box-shadow: 0 0 60px rgba(45, 212, 191, 0.2), inset -20px -20px 40px rgba(0,0,0,0.5);
      position: relative; z-index: 2; margin-bottom: 3rem; animation: floatY 8s ease-in-out infinite;
    }
    .planet-ring {
      position: absolute; top: 50%; left: 50%; width: 450px; height: 120px;
      border: 2px solid rgba(45, 212, 191, 0.3); border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-20deg); z-index: 1;
    }
    @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

    .visual-content { position: relative; z-index: 10; text-align: center; max-width: 500px; }
    .visual-content h2 { font-size: 2.2rem; font-weight: 800; color: #fff; margin-bottom: 1rem; letter-spacing: -0.5px; }
    .visual-content p { font-size: 1.1rem; color: #94a3b8; line-height: 1.6; }

    @media (max-width: 968px) { .visual-side { display: none; } .form-side { padding: 1.5rem; } }
  </style>
</head>
<body>

  <div class="split-layout">
    <div class="form-side">
      <div class="form-container">
        
        <div class="brand-logo"><i class="fa-solid fa-rocket"></i> LaunchAxis</div>
        
        <div class="form-header">
          <h1>Welcome Back</h1>
          <p>Access your central command kernel.</p>
        </div>

        <button class="google-btn" id="googleLogin">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google" />
          Log in with Google
        </button>

        <div class="divider">Or log in with email</div>

        <form id="loginForm">
          <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="ceo@startup.com" required />
          </div>
          
          <div class="input-group" style="margin-bottom: 0;">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required />
          </div>
          <a href="#" class="forgot-link" id="forgotPassword">Forgot Password?</a>

          <button type="submit" class="btn-primary" id="loginBtn">Access Kernel <i class="fa-solid fa-arrow-right"></i></button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="auth.html">Sign up here</a>
        </div>
      </div>
    </div>

    <div class="visual-side">
      <div class="cosmic-overlay"></div>
      <div class="planet"><div class="planet-ring"></div></div>
      <div class="visual-content">
        <h2>Command your empire.</h2>
        <p>Monitor your active storefronts, financial metrics, and customer insights instantly through the LaunchAxis dashboard.</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgW3AW6wuebd8nde-Udenu-3X6hPbLkhY",
      authDomain: "launchaxis.firebaseapp.com",
      projectId: "launchaxis",
      storageBucket: "launchaxis.firebasestorage.app",
      messagingSenderId: "986994724231",
      appId: "1:986994724231:web:cf895161f7cf6c366a9722"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Login Logic
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        
        // --- SMART REDIRECT LOGIC ---
        if (localStorage.getItem("pendingLaunchAxisData")) {
            localStorage.setItem("launchAxisTempData", localStorage.getItem("pendingLaunchAxisData"));
            localStorage.removeItem("pendingLaunchAxisData");
            window.location.href = "loading.html";
        } else {
            window.location.href = "index.html"; 
        }

      } catch (error) {
        alert("Access Denied: " + error.message);
        btn.disabled = false;
        btn.innerHTML = 'Access Kernel <i class="fa-solid fa-arrow-right"></i>';
      }
    });

    // Forgot Password Logic
    document.getElementById("forgotPassword").addEventListener("click", async function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      
      if (!email) {
        alert("Please enter your email address in the field above to request a reset link.");
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        alert(`Security link dispatched to ${email}. Check your inbox to reset your password.`);
      } catch (error) {
        alert("Recovery Failed: " + error.message);
      }
    });

    // Google Sign-In
    document.getElementById("googleLogin").addEventListener("click", function () {
      const provider = new GoogleAuthProvider();
      signInWithPopup(auth, provider)
        .then(() => {
            // --- SMART REDIRECT LOGIC FOR GOOGLE ---
            if (localStorage.getItem("pendingLaunchAxisData")) {
                localStorage.setItem("launchAxisTempData", localStorage.getItem("pendingLaunchAxisData"));
                localStorage.removeItem("pendingLaunchAxisData");
                window.location.href = "loading.html";
            } else {
                window.location.href = "index.html"; 
            }
        })
        .catch(error => alert("Google Login failed: " + error.message));
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Start Building – LaunchAxis</title>
  <style>
    :root {
      --bg-dark: #09090b;
      --card-bg: #18181b;
      --border-color: #27272a;
      --neon-teal: #2dd4bf;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      margin: 0;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .form-container {
      background-color: var(--card-bg);
      padding: 3rem;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      max-width: 900px;
      width: 100%;
    }

    .header-text {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .header-text h2 {
      color: var(--text-main);
      font-size: 2rem;
      font-weight: 800;
      margin: 0 0 10px 0;
      letter-spacing: -1px;
    }

    .header-text p {
      color: var(--neon-teal);
      margin: 0;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.9rem;
    }

    /* Grid Layout for Single Page */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr; /* Stacks on mobile */
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    input[type="text"], input[type="email"], textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #000;
      color: var(--text-main);
      font-size: 1rem;
      transition: border 0.3s, box-shadow 0.3s;
      box-sizing: border-box;
    }

    input[type="text"]:focus, input[type="email"]:focus, textarea:focus {
      outline: none;
      border-color: var(--neon-teal);
      box-shadow: 0 0 10px rgba(45, 212, 191, 0.2);
    }

    .selection-group {
      background: #000;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .selection-group label {
      display: flex;
      align-items: center;
      color: var(--text-main);
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 0.8rem;
    }

    .selection-group label:last-child {
      margin-bottom: 0;
    }

    input[type="checkbox"], input[type="radio"] {
      accent-color: var(--neon-teal);
      width: 18px;
      height: 18px;
      margin-right: 10px;
      cursor: pointer;
    }

    .submit-btn {
      background-color: var(--neon-teal);
      color: #000;
      font-weight: 800;
      font-size: 1.1rem;
      border: none;
      padding: 1rem;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(45, 212, 191, 0.3);
    }

    .submit-btn:hover {
      background-color: #14b8a6;
      box-shadow: 0 6px 20px rgba(45, 212, 191, 0.5);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="header-text">
      <h2>Initialize Your Business</h2>
      <p>System Setup & Architecture</p>
    </div>

    <form id="multiStepForm">
      <div class="form-grid">
        
        <div class="form-group">
          <label for="businessName">Business Name</label>
          <input type="text" id="businessName" name="businessName" placeholder="e.g. Neon Studios" />
        </div>

        <div class="form-group">
          <label for="email">Admin Email Address</label>
          <input type="email" id="email" name="email" required placeholder="admin@example.com" />
        </div>

        <div class="form-group full-width">
          <label for="businessDesc">Core Business Description</label>
          <textarea id="businessDesc" name="businessDesc" rows="2" placeholder="Briefly describe your products, services, and target audience..."></textarea>
        </div>

        <div class="form-group">
          <label>Primary Offering</label>
          <div class="selection-group">
            <label><input type="radio" name="businessType" value="Products" required /> Digital / Physical Products</label>
            <label><input type="radio" name="businessType" value="Services" /> Service Based</label>
          </div>
        </div>

        <div class="form-group">
          <label>Your Current Status</label>
          <div class="selection-group">
            <label><input type="radio" name="userType" value="Student with Startup Idea" required /> Student Startup</label>
            <label><input type="radio" name="userType" value="Freelancer" /> Freelancer</label>
            <label><input type="radio" name="userType" value="Existing Business Owner" /> Established Business</label>
          </div>
        </div>

        <div class="form-group full-width">
          <label>AI Generation Requirements</label>
          <div class="selection-group" style="display: flex; gap: 20px; flex-wrap: wrap;">
            <label><input type="checkbox" name="needs" value="Logo & Branding Kit" /> Brand Identity Kit</label>
            <label><input type="checkbox" name="needs" value="Business Website" /> E-Commerce Storefront</label>
            <label><input type="checkbox" name="needs" value="Accounting Setup" /> Finance & Accounting Dashboard</label>
          </div>
        </div>

        <div class="form-group full-width">
          <label for="details">Additional Directives (Optional)</label>
          <textarea id="details" name="details" rows="2" placeholder="Specify color preferences, specific features, or target demographics..."></textarea>
        </div>

        <button type="submit" class="submit-btn full-width">Initialize Setup</button>
      </div>
    </form>
  </div>

  <script type="module">
  // NOTE: If you are using Firebase modules, import your auth here. 
  // Example: import { auth } from './firebaseConfig.js';
  
  // 1. THIS IS YOUR GATEKEEPER
  // Replace this function with your actual code that shows your existing login popup
  function triggerAuthPopup() {
      // e.g., document.getElementById('loginModal').style.display = 'block';
      alert("Authentication Required: Showing Login/Signup Popup Now...");
  }

  // 2. CHECK LOGIN STATUS
  // Replace this with your actual Firebase auth check (e.g., auth.currentUser !== null)
  function isUserLoggedIn() {
      // Currently hardcoded to false so you can test the popup trigger
      return false; 
  }

  // Handle Form Submission
  document.getElementById("multiStepForm").addEventListener("submit", function (e) {
      // 1. Stop the page from refreshing instantly
      e.preventDefault();

      try {
          // 2. Gather the form inputs
          const businessName = document.getElementById("businessName").value.trim();
          const businessDesc = document.getElementById("businessDesc").value.trim();
          const businessType = document.querySelector("input[name='businessType']:checked")?.value || "";
          const needs = [...document.querySelectorAll("input[name='needs']:checked")].map(cb => cb.value);
          const userType = document.querySelector("input[name='userType']:checked")?.value || "";
          const details = document.getElementById("details").value.trim();
          const email = document.getElementById("email").value.trim();

          // 3. Validation Check
          if (!email || !businessType) {
            alert("Please fill all required fields.");
            return;
          }

          // 4. Package data for the AI Kernel
          const userData = {
            businessName: businessName || "Auto-Generate", 
            businessDesc,
            businessType,
            preferences: needs,
            userType,
            extraDetails: details,
            email
          };

          // ==========================================
          // 5. THE NEW AUTHENTICATION INTERCEPTOR
          // ==========================================
          if (!isUserLoggedIn()) {
              // Store the data temporarily so we don't lose their answers!
              localStorage.setItem("pendingLaunchAxisData", JSON.stringify(userData));
              
              // Trigger your existing Firebase popup
              triggerAuthPopup();
              return; // Stop the function here. Do not go to loading screen yet!
          }

          // 6. If they ARE logged in, proceed normally
          localStorage.setItem("launchAxisTempData", JSON.stringify(userData));
          window.location.href = "./loading.html";

      } catch (error) {
          console.error("Form collection failed:", error);
          alert("An error occurred. Open the developer console (Inspect -> Console) to see the details.");
      }
  });

  // ==========================================
  // 7. LISTENER FOR AFTER SUCCESSFUL LOGIN
  // ==========================================
  // Call this function right after your user successfully logs in via your popup
  window.onSuccessfulLogin = function() {
      const savedData = localStorage.getItem("pendingLaunchAxisData");
      if (savedData) {
          // Move the pending data to the active state and push them to the loading screen
          localStorage.setItem("launchAxisTempData", savedData);
          localStorage.removeItem("pendingLaunchAxisData");
          window.location.href = "./loading.html";
      }
  }
  </script>
</body>
</html>

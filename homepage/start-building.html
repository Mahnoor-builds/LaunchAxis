<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Start Building – LaunchAxis.ai</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f172a;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .form-container {
      background-color: #1e293b;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
      max-width: 600px;
      width: 100%;
    }
    h2 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 1.5rem;
    }
    .form-step {
      display: none;
    }
    .form-step.active {
      display: block;
    }
    label {
      font-weight: 500;
    }
    input[type="text"], input[type="email"], textarea, select {
      width: 100%;
      padding: 0.6rem;
      margin-top: 0.5rem;
      margin-bottom: 1.2rem;
      border-radius: 8px;
      border: none;
      background-color: #334155;
      color: #f1f5f9;
    }
    .checkbox-group, .radio-group {
      margin-bottom: 1.2rem;
    }
    .checkbox-group label,
    .radio-group label {
      display: flex;
      align-items: center;
      margin-bottom: 0.6rem;
      gap: 0.6rem;
    }
    input[type="checkbox"], input[type="radio"] {
      accent-color: #38bdf8;
      transform: scale(1.2);
    }
    button {
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 1rem;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #0ea5e9;
    }
    .step-title {
      margin-bottom: 1rem;
      font-size: 1.1rem;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Start Building Your Business</h2>
    <form id="multiStepForm">
      
      <!-- Step 1 -->
      <div class="form-step active">
        <label for="businessName">What is your business name or idea?</label>
        <input type="text" id="businessName" name="businessName" required placeholder="e.g. SweetBites Bakery" />

        <label for="businessDesc">Briefly describe your business</label>
        <textarea id="businessDesc" name="businessDesc" rows="3" placeholder="e.g. A home-based bakery selling cakes to busy professionals"></textarea>

        <label for="businessType">What are you selling?</label>
      <div class="radio-group">
        <label><input type="radio" name="businessType" value="Products" required /> Products</label>
        <label><input type="radio" name="businessType" value="Services" /> Services</label>
      </div>

        <button type="button" class="next-btn">Next</button>
      </div>

      <!-- Step 2 -->
      <div class="form-step">
        <p class="step-title">What would you like us to generate for you?</p>
        <div class="checkbox-group">
          <label><input type="checkbox" name="needs" value="Logo & Branding Kit" /> Logo & Branding Kit</label>
          <label><input type="checkbox" name="needs" value="Business Website" /> Business Website</label>
          <label><input type="checkbox" name="needs" value="Accounting Setup" /> Accounting Setup</label>
        </div>
        <button type="button" class="next-btn">Next</button>
      </div>

      <!-- Step 3 -->
      <div class="form-step">
        <p class="step-title">Tell us more about you:</p>
        <div class="radio-group">
          <label><input type="radio" name="userType" value="Student with Startup Idea" required /> Student with Startup Idea</label>
          <label><input type="radio" name="userType" value="Freelancer" /> Freelancer</label>
          <label><input type="radio" name="userType" value="Existing Business Owner" /> Existing Business Owner</label>
        </div>

        <label for="details">Any extra notes or preferences?</label>
        <textarea id="details" name="details" rows="4" placeholder="Optional: Anything else you'd like us to consider..."></textarea>

        <label for="email">Your Email (to send your setup)</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" />

        <button type="submit">Submit</button>
      </div>
    </form>
  </div>

  <script type="module">
  // Firebase Imports
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  // Your Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyCgW3AW6wuebd8nde-Udenu-3X6hPbLkhY",
    authDomain: "launchaxis.firebaseapp.com",
    projectId: "launchaxis",
    storageBucket: "launchaxis.firebasestorage.app",
    messagingSenderId: "986994724231",
    appId: "1:986994724231:web:cf895161f7cf6c366a9722"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const realtimeDB = getDatabase(app);

  // Step Navigation Logic
  const steps = document.querySelectorAll(".form-step");
  const nextBtns = document.querySelectorAll(".next-btn");
  let currentStep = 0;

  nextBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      if (currentStep < steps.length - 1) {
        steps[currentStep].classList.remove("active");
        currentStep++;
        steps[currentStep].classList.add("active");
      }
    });
  });

  // Handle Form Submission
  document.getElementById("multiStepForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const businessName = document.getElementById("businessName").value.trim();
  const businessDesc = document.getElementById("businessDesc").value.trim();
  const businessType = document.querySelector("input[name='businessType']:checked")?.value || "";
  const needs = [...document.querySelectorAll("input[name='needs']:checked")].map(cb => cb.value);
  const userType = document.querySelector("input[name='userType']:checked")?.value || "";
  const details = document.getElementById("details").value.trim();
  const email = document.getElementById("email").value.trim();

  // Validate
  if (!businessName || !email || !businessType) {
    alert("Please fill all required fields.");
    return;
  }

  const userData = {
    businessName,
    businessDesc,
    businessType,
    preferences: needs,
    userType,
    extraDetails: details,
    email,
    timestamp: serverTimestamp()
  };

  try {
  // ✅ Store user setup data in Firestore
  await addDoc(collection(db, "users"), userData);

  // ✅ Store setup status in Realtime Database using safe key
  const userKey = userData.email.replace(/[.#$[\]]/g, "_"); // Avoid special characters
  await set(ref(realtimeDB, `setupStatus/${userKey}`), "generating");

  alert("Thank you! Your business setup is being processed.");
  window.location.href = "loading.html";
} catch (error) {
  alert("Submission failed: " + error.message);
  console.error("Firestore error:", error);
}

});

</script>
</body>
  </html>

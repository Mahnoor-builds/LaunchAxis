<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Initialize Workspace | LaunchAxis</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    :root {
      --bg-dark: #030712;
      --card-bg: rgba(10, 10, 14, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --neon-teal: #2dd4bf;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-dark); color: var(--text-main);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 2rem 1rem; position: relative; overflow-x: hidden;
    }

    /* Cosmic Background */
    .space-ambient-glow { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(45, 212, 191, 0.1) 0%, transparent 60%); z-index: -1; }
    .space-ambient-glow-2 { position: fixed; bottom: -10%; right: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 60%); z-index: -1; }
    .cosmic-dust-overlay { position: fixed; inset: 0; background-image: radial-gradient(#ffffff 1px, transparent 1px); background-size: 50px 50px; opacity: 0.03; z-index: -1; }

    .form-container {
      background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: clamp(2rem, 5vw, 3rem); border-radius: 20px; border: 1px solid var(--border-color);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      max-width: 800px; width: 100%; animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .header-text { text-align: center; margin-bottom: 2.5rem; }
    .header-text h2 { font-size: clamp(1.8rem, 4vw, 2.2rem); font-weight: 800; margin: 0 0 8px 0; letter-spacing: -0.5px; }
    .header-text p { color: var(--neon-teal); margin: 0; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; font-size: 0.85rem; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
    
    .full-width { grid-column: 1 / -1; }
    .form-group { display: flex; flex-direction: column; }
    label.field-label { font-weight: 700; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }

    input[type="text"], input[type="email"], textarea {
      width: 100%; padding: 0.9rem 1rem; border-radius: 10px;
      border: 1px solid #1e293b; background-color: #0f172a;
      color: var(--text-main); font-size: 0.95rem; transition: all 0.2s ease; resize: vertical;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--neon-teal); background-color: #020617; box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.15); }

    .selection-group { background: #0f172a; padding: 1rem; border-radius: 10px; border: 1px solid #1e293b; display: flex; flex-direction: column; gap: 12px; }
    .selection-group.row-layout { flex-direction: row; flex-wrap: wrap; gap: 20px; }
    .radio-label { display: flex; align-items: center; font-size: 0.9rem; font-weight: 600; cursor: pointer; color: #e2e8f0; transition: color 0.2s; }
    .radio-label:hover { color: var(--neon-teal); }
    input[type="checkbox"], input[type="radio"] { accent-color: var(--neon-teal); width: 16px; height: 16px; margin-right: 10px; cursor: pointer; }

    .submit-btn {
      background: linear-gradient(135deg, #00f0ff, #8B5CF6); color: #000;
      font-weight: 800; font-size: 1rem; border: none; padding: 1.1rem; border-radius: 10px;
      cursor: pointer; margin-top: 1rem; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 240, 255, 0.25); }

    /* =========================================
       CUSTOM AUTHENTICATION MODAL POPUP
       ========================================= */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center; z-index: 1000;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .modal-overlay.active { display: flex; opacity: 1; }

    .modal-card {
      background: rgba(10, 10, 14, 0.9); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px; padding: 2.5rem; max-width: 400px; width: 90%;
      text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      transform: translateY(20px); transition: transform 0.3s ease;
    }
    .modal-overlay.active .modal-card { transform: translateY(0); }

    .modal-icon { width: 60px; height: 60px; background: rgba(45, 212, 191, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: var(--neon-teal); margin: 0 auto 1.5rem; border: 1px solid rgba(45, 212, 191, 0.3); }
    .modal-card h3 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; color: #fff; }
    .modal-card p { font-size: 0.9rem; color: #94a3b8; margin-bottom: 2rem; line-height: 1.5; }

    .modal-btn-primary { display: block; width: 100%; background: #2dd4bf; color: #020617; font-weight: 800; padding: 0.9rem; border-radius: 8px; text-decoration: none; margin-bottom: 12px; transition: background 0.2s; }
    .modal-btn-primary:hover { background: #14b8a6; }
    
    .modal-btn-secondary { display: block; width: 100%; background: transparent; color: #f8fafc; border: 1px solid #334155; font-weight: 700; padding: 0.9rem; border-radius: 8px; text-decoration: none; transition: background 0.2s; margin-bottom: 1rem; }
    .modal-btn-secondary:hover { background: #1e293b; }

    .close-modal { background: none; border: none; color: #64748b; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: underline; }
    .close-modal:hover { color: #f8fafc; }
  </style>
</head>
<body>
  <div class="space-ambient-glow"></div>
  <div class="space-ambient-glow-2"></div>
  <div class="cosmic-dust-overlay"></div>

  <div class="form-container">
    <div class="header-text">
      <h2>Architect Your Infrastructure</h2>
      <p><i class="fa-solid fa-microchip"></i> System Setup & Parameter Input</p>
    </div>

    <form id="multiStepForm">
      <div class="form-grid">
        
        <div class="form-group">
          <label class="field-label" for="businessName">Business / Brand Name</label>
          <input type="text" id="businessName" name="businessName" placeholder="Leave blank for AI generation" />
        </div>

        <div class="form-group">
          <label class="field-label" for="email">Admin Email Address</label>
          <input type="email" id="email" name="email" required placeholder="ceo@startup.com" />
        </div>

        <div class="form-group full-width">
          <label class="field-label" for="businessDesc">Product or Service Description</label>
          <textarea id="businessDesc" name="businessDesc" rows="3" required placeholder="Describe exactly what you sell or the services you provide. Who is your target customer?"></textarea>
        </div>

        <div class="form-group">
          <label class="field-label">Primary Offering Type</label>
          <div class="selection-group">
            <label class="radio-label"><input type="radio" name="businessType" value="ecommerce" required /> Physical / Digital Products</label>
            <label class="radio-label"><input type="radio" name="businessType" value="service" /> Service / Agency Work</label>
          </div>
        </div>

        <div class="form-group">
          <label class="field-label">Founder Profile</label>
          <div class="selection-group">
            <label class="radio-label"><input type="radio" name="userType" value="Startup Founder" required /> Startup Founder</label>
            <label class="radio-label"><input type="radio" name="userType" value="Freelancer" /> Freelancer</label>
            <label class="radio-label"><input type="radio" name="userType" value="Student" /> Student</label>
            <label class="radio-label"><input type="radio" name="userType" value="Small Business Owner" /> Small Business Owner</label>
          </div>
        </div>

        <div class="form-group full-width">
          <label class="field-label">Modules to Activate</label>
          <div class="selection-group row-layout">
            <label class="radio-label"><input type="checkbox" name="needs" value="wantsBranding" checked /> Brand Identity Kit</label>
            <label class="radio-label"><input type="checkbox" name="needs" value="wantsWebsite" checked /> Website / Storefront</label>
            <label class="radio-label"><input type="checkbox" name="needs" value="wantsAccounting" checked /> Finance Ledger Dashboard</label>
          </div>
        </div>

        <button type="submit" class="submit-btn full-width">Initialize Kernel Sequence <i class="fa-solid fa-rocket"></i></button>
      </div>
    </form>
  </div>

  <!-- CUSTOM AUTHENTICATION MODAL -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-icon"><i class="fa-solid fa-lock"></i></div>
      <h3>Authentication Required</h3>
      <p>You need a secure LaunchAxis account to save and deploy your business infrastructure.</p>
      <a href="auth.html" class="modal-btn-primary">Create Free Account</a>
      <a href="login.html" class="modal-btn-secondary">Log in to existing account</a>
      <button class="close-modal" id="closeModalBtn">Cancel & Go Back</button>
    </div>
  </div>

  <!-- FIREBASE & LOGIC SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    // 1. FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyCgW3AW6wuebd8nde-Udenu-3X6hPbLkhY",
      authDomain: "launchaxis.firebaseapp.com",
      projectId: "launchaxis",
      storageBucket: "launchaxis.firebasestorage.app",
      messagingSenderId: "986994724231",
      appId: "1:986994724231:web:cf895161f7cf6c366a9722"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    let currentUser = null;

    // Track real login state
    onAuthStateChanged(auth, (user) => {
        currentUser = user;
    });

    // 2. MODAL CONTROLS
    const authModal = document.getElementById("authModal");
    document.getElementById("closeModalBtn").addEventListener("click", () => {
        authModal.classList.remove("active");
    });

    // 3. FORM SUBMISSION
    document.getElementById("multiStepForm").addEventListener("submit", function (e) {
        e.preventDefault();

        try {
            const businessName = document.getElementById("businessName").value.trim();
            const businessDesc = document.getElementById("businessDesc").value.trim();
            const businessType = document.querySelector("input[name='businessType']:checked")?.value || "";
            const userType = document.querySelector("input[name='userType']:checked")?.value || "";
            const email = document.getElementById("email").value.trim();
            
            const checkedModules = [...document.querySelectorAll("input[name='needs']:checked")].map(cb => cb.value);
            const features = {
                wantsBranding: checkedModules.includes("wantsBranding"),
                wantsWebsite: checkedModules.includes("wantsWebsite"),
                wantsAccounting: checkedModules.includes("wantsAccounting")
            };

            const userData = { businessName: businessName || "Auto-Generate", businessDesc, businessType, userType, features, email };

            // SECURE GATEWAY CHECK
            if (!currentUser) {
                // Not logged in! Save to pending and show custom modal.
                localStorage.setItem("pendingLaunchAxisData", JSON.stringify(userData));
                authModal.classList.add("active");
            } else {
                // Logged in! Proceed directly to the Loading screen.
                localStorage.setItem("launchAxisTempData", JSON.stringify(userData));
                window.location.href = "./loading.html";
            }

        } catch (error) {
            console.error("Form collection failed:", error);
            alert("An error occurred. Please check your inputs.");
        }
    });
  </script>
</body>
</html>

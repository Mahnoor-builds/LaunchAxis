<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axis | LaunchAxis AI Co-Founder</title>
  <link rel="stylesheet" href="chatbot.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <div class="ambient-glow"></div>
  <div class="ambient-glow-secondary"></div>

  <div class="chat-wrapper">
    <header class="chat-header">
      <div class="header-brand">
        <div class="axis-avatar">
          <i class="fa-solid fa-atom"></i>
        </div>
        <div>
          <h1>AXIS <span class="badge-tag">AI CO-FOUNDER</span></h1>
          <p><span class="status-dot"></span> <span id="userStatusLabel">LaunchAxis Neural Core Online</span></p>
        </div>
      </div>
      <div>
        <a href="#" id="clearChatBtn" class="close-btn" style="margin-right: 15px; font-size: 1.1rem;" title="Clear Chat Memory"><i class="fa-solid fa-trash-can"></i></a>
        <a href="index.html" class="close-btn" title="Exit Axis"><i class="fa-solid fa-xmark"></i></a>
      </div>
    </header>

    <main class="chat-box" id="chatBox">
      <!-- Chat bubbles injected here -->
    </main>

    <div class="chat-input-area">
      <form id="chatForm">
        <input type="text" id="userInput" placeholder="Ask Axis anything about your startup or LaunchAxis..." autocomplete="off" required />
        <button type="submit" id="sendBtn">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCgW3AW6wuebd8nde-Udenu-3X6hPbLkhY",
        authDomain: "launchaxis.firebaseapp.com",
        projectId: "launchaxis",
        storageBucket: "launchaxis.firebasestorage.app",
        messagingSenderId: "986994724231",
        appId: "1:986994724231:web:cf895161f7cf6c366a9722"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const chatForm = document.getElementById("chatForm");
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const userStatusLabel = document.getElementById("userStatusLabel");
    const clearChatBtn = document.getElementById("clearChatBtn");

    let currentUserContext = null;
    const MAX_MESSAGES_PER_SESSION = 15;
    const MESSAGE_COOLDOWN_MS = 4000;

    // --- 🚨 NEW: PERSISTENT CHAT MEMORY ARRAY ---
    let chatHistory = JSON.parse(localStorage.getItem("axisChatHistory")) || [];

    // Helper to save messages to local storage
    function saveMessage(sender, message) {
        chatHistory.push({ sender, message });
        localStorage.setItem("axisChatHistory", JSON.stringify(chatHistory));
    }

    // Handle clearing the chat
    clearChatBtn.addEventListener("click", function(e) {
        e.preventDefault();
        if(confirm("Are you sure you want to clear your chat memory with Axis?")) {
            localStorage.removeItem("axisChatHistory");
            location.reload();
        }
    });

    async function initAxisMemory() {
      const savedEmail = localStorage.getItem("launchAxisUserEmail");
      const tempData = localStorage.getItem("launchAxisTempData");
      let welcomeMessage = "";

      if (savedEmail) {
        try {
          const userDocRef = doc(db, "users", savedEmail);
          const snap = await getDoc(userDocRef);
          if (snap.exists()) {
            currentUserContext = snap.data();
            userStatusLabel.textContent = `Connected to ${currentUserContext.businessName || "Store"}`;
            welcomeMessage = `Welcome back. I am <b>Axis</b>, your LaunchAxis Co-Founder. I have your architecture for <b>${currentUserContext.businessName || "your store"}</b> loaded into memory. Where do you need strategic or technical assistance today?`;
          }
        } catch (err) { console.warn("Firestore fetch error:", err); }
      } else if (tempData) {
        currentUserContext = JSON.parse(tempData);
        userStatusLabel.textContent = `Onboarding: ${currentUserContext.businessName || "New Startup"}`;
        welcomeMessage = `Hello! I am <b>Axis</b>. I see you are currently setting up <b>${currentUserContext.businessName || "a new business"}</b>. How can I help refine your business explanation, branding, or dashboard setup?`;
      } else {
        userStatusLabel.textContent = "Platform Guest Mode";
        welcomeMessage = "System Online. I am <b>Axis</b>, the LaunchAxis AI Co-Founder. Whether you need help outlining a startup idea, understanding how our Naming & Logo engines work, or managing e-commerce logistics, ask below.";
      }

      // --- 🚨 NEW: LOAD HISTORY OR SHOW WELCOME ---
      if (chatHistory.length > 0) {
          // If we have history, render all previous messages
          chatHistory.forEach(msg => appendMessage(msg.sender, msg.message, true, true));
      } else {
          // If no history, show the welcome message and save it!
          appendMessage("AI", welcomeMessage);
      }
    }

    chatForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      let msgCount = sessionStorage.getItem("axisMsgCount") ? parseInt(sessionStorage.getItem("axisMsgCount")) : 0;
      let lastMsgTime = sessionStorage.getItem("axisLastMsgTime") ? parseInt(sessionStorage.getItem("axisLastMsgTime")) : 0;
      const now = Date.now();

      if (now - lastMsgTime < MESSAGE_COOLDOWN_MS) {
        appendMessage("AI", "<i class='fa-solid fa-shield-halved' style='color:#ef4444;'></i> Neural Core cooling down. Please wait 4 seconds.", false, true);
        return;
      }
      if (msgCount >= MAX_MESSAGES_PER_SESSION) {
        appendMessage("AI", "<i class='fa-solid fa-lock' style='color:#ef4444;'></i> Session quota reached. Axis is resting. Clear chat to restart.", false, true);
        return;
      }

      sessionStorage.setItem("axisLastMsgTime", now.toString());
      sessionStorage.setItem("axisMsgCount", (msgCount + 1).toString());

      // Print and save User text
      appendMessage("User", text);
      
      userInput.value = "";
      userInput.disabled = true;
      sendBtn.disabled = true;

      // Print "Thinking" text (but DO NOT save it to history)
      appendMessage("AI", "<span class='typing-dots'>Axis is thinking<span>.</span><span>.</span><span>.</span></span>", false, true);

      const response = await getGeminiResponse(text);
      updateLastMessage(response);

      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.focus();
    });

    // Modified to handle history rendering so we don't save duplicates
    function appendMessage(sender, message, isHistorical = false, isTemp = false) {
      const row = document.createElement("div");
      row.className = `message-row ${sender === "AI" ? "ai-row" : "user-row"}`;
      const iconHTML = sender === "AI" ? `<div class="message-icon ai-icon"><i class="fa-solid fa-atom"></i></div>` : ``;
      const bubbleClass = sender === "AI" ? "ai-message" : "user-message";

      row.innerHTML = `${iconHTML}<div class="message-bubble ${bubbleClass}">${message}</div>`;
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;

      // If it's a brand new, permanent message, save it!
      if (!isHistorical && !isTemp) {
          saveMessage(sender, message);
      }
    }

    function updateLastMessage(newText) {
      const aiMessages = chatBox.querySelectorAll(".ai-message");
      if (aiMessages.length > 0) {
        aiMessages[aiMessages.length - 1].innerHTML = newText;
        // Save the final AI response to memory
        saveMessage("AI", newText);
      }
    }

    async function getGeminiResponse(prompt) {
      // --- RE-ENGINEERED PROMPT FOR SIMPLE STEP-BY-STEP FORMATTING ---
      let systemPrompt = `You are Axis, the executive AI Co-Founder built into the LaunchAxis startup platform.
Your persona: Highly supportive, acts like a smart guide, and speaks in plain, simple English.
Strict Formatting Rules:
1. Never use emojis.
2. Use Markdown bolding (**text**) for UI buttons, tabs, and key terms.
3. WHEN GIVING INSTRUCTIONS ON HOW TO DO SOMETHING IN THE DASHBOARD, YOU MUST USE NUMBERED BULLET POINTS. Do not use long block paragraphs. Keep steps extremely short and direct (Example format: "1. Go to the **Finance** dashboard. 2. Click on **Directory**.").
4. Keep all responses crisp, actionable, and easy to read.`;

      if (currentUserContext) {
        systemPrompt += `\n\nCURRENT USER MEMORY:
User's Business Name: ${currentUserContext.businessName || "Unknown"}
Industry: ${currentUserContext.businessType || "E-commerce"}
Description: ${currentUserContext.businessDesc || "Not specified"}`;
      }

      const finalPrompt = `${systemPrompt}\n\nUser Question: ${prompt}`;

      try {
        // --- SECURE VERCEL API CALL ---
        const response = await fetch('/api/gemini', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: finalPrompt })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);

        if (data.text) {
            let cleanText = data.text;
            cleanText = cleanText.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");
            cleanText = cleanText.replace(/\n/g, "<br>");
            return cleanText;
        } else {
            return "Kernel error: Could not process neural response.";
        }
      } catch (error) {
        return `Connection error: ${error.message}`;
      }
    }
    initAxisMemory();
  </script>
</body>
</html>

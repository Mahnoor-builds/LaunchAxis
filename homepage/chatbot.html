<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axis | LaunchAxis AI Co-Founder</title>
  <link rel="stylesheet" href="chatbot.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- Lovable-Inspired Cosmic Background Glow -->
  <div class="ambient-glow"></div>
  <div class="ambient-glow-secondary"></div>

  <div class="chat-wrapper">
    
    <!-- HEADER -->
    <header class="chat-header">
      <div class="header-brand">
        <div class="axis-avatar">
          <i class="fa-solid fa-atom"></i>
        </div>
        <div>
          <h1>AXIS <span class="badge-tag">AI CO-FOUNDER</span></h1>
          <p><span class="status-dot"></span> <span id="userStatusLabel">LaunchAxis Neural Core Online</span></p>
        </div>
      </div>
      <a href="index.html" class="close-btn" title="Exit Axis"><i class="fa-solid fa-xmark"></i></a>
    </header>

    <!-- CHAT BOX -->
    <main class="chat-box" id="chatBox">
      <!-- Welcome Message is injected dynamically by JS -->
    </main>

    <!-- INPUT AREA -->
    <div class="chat-input-area">
      <form id="chatForm">
        <input type="text" id="userInput" placeholder="Ask Axis anything about your startup or LaunchAxis..." autocomplete="off" required />
        <button type="submit" id="sendBtn">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </form>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    // --- 1. FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyCgW3AW6wuebd8nde-Udenu-3X6hPbLkhY",
        authDomain: "launchaxis.firebaseapp.com",
        projectId: "launchaxis",
        storageBucket: "launchaxis.firebasestorage.app",
        messagingSenderId: "986994724231",
        appId: "1:986994724231:web:cf895161f7cf6c366a9722"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- 2. ELEMENTS & STATE ---
    const chatForm = document.getElementById("chatForm");
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const userStatusLabel = document.getElementById("userStatusLabel");

    let currentUserContext = null;

    // --- 3. MEMORY INITIALIZATION ---
    async function initAxisMemory() {
      // Check if user has an active session
      const savedEmail = localStorage.getItem("launchAxisUserEmail");
      const tempData = localStorage.getItem("launchAxisTempData");

      if (savedEmail) {
        try {
          const userDocRef = doc(db, "users", savedEmail);
          const snap = await getDoc(userDocRef);
          if (snap.exists()) {
            currentUserContext = snap.data();
            userStatusLabel.textContent = `Connected to ${currentUserContext.businessName || "Store"}`;
            appendMessage("AI", `Welcome back. I am <b>Axis</b>, your LaunchAxis Co-Founder. I have your architecture for <b>${currentUserContext.businessName || "your store"}</b> loaded into memory. Where do you need strategic or technical assistance today?`);
            return;
          }
        } catch (err) {
          console.warn("Could not fetch user Firestore doc:", err);
        }
      } else if (tempData) {
        try {
          currentUserContext = JSON.parse(tempData);
          userStatusLabel.textContent = `Onboarding: ${currentUserContext.businessName || "New Startup"}`;
          appendMessage("AI", `Hello! I am <b>Axis</b>. I see you are currently setting up <b>${currentUserContext.businessName || "a new business"}</b>. How can I help refine your business explanation, branding, or dashboard setup?`);
          return;
        } catch (e) {
          console.warn("Local temp data error");
        }
      }

      // Guest Fallback
      userStatusLabel.textContent = "Platform Guest Mode";
      appendMessage("AI", "System Online. I am <b>Axis</b>, the LaunchAxis AI Co-Founder. Whether you need help outlining a startup idea, understanding how our Naming & Logo engines work, or managing e-commerce logistics, ask below.");
    }

    // --- 4. CHAT HANDLER ---
    chatForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage("User", text);
      userInput.value = "";
      userInput.disabled = true;
      sendBtn.disabled = true;

      appendMessage("AI", "<span class='typing-dots'>Axis is thinking<span>.</span><span>.</span><span>.</span></span>");

      const response = await getGeminiResponse(text);
      updateLastMessage(response);

      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.focus();
    });

    function appendMessage(sender, message) {
      const row = document.createElement("div");
      row.className = `message-row ${sender === "AI" ? "ai-row" : "user-row"}`;

      const iconHTML = sender === "AI" 
        ? `<div class="message-icon ai-icon"><i class="fa-solid fa-atom"></i></div>` 
        : ``;

      const bubbleClass = sender === "AI" ? "ai-message" : "user-message";

      row.innerHTML = `
        ${iconHTML}
        <div class="message-bubble ${bubbleClass}">
          ${message}
        </div>
      `;
      
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function updateLastMessage(newText) {
      const aiMessages = chatBox.querySelectorAll(".ai-message");
      if (aiMessages.length > 0) {
        aiMessages[aiMessages.length - 1].innerHTML = newText;
      }
    }

    // --- 5. GEMINI API WITH SMART CONTEXT INJECTION ---
    async function getGeminiResponse(prompt) {
      const apiKey = ""; // Replace with your key
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

      let systemPrompt = `You are Axis, the executive AI Co-Founder built into the LaunchAxis startup platform.
Your persona: Highly strategic, technical, concise, professional, and supportive.
Strict Formatting Rules: Never use emojis. Use Markdown bolding (**text**) for key terms and metrics. Keep paragraphs crisp.
Platform Knowledge: LaunchAxis offers AI-driven Naming & Domain checks (.com, .store, .co), SVG Logo generation, EmailJS order receipts, and live Website/Ledger auto-syncing.`;

      if (currentUserContext) {
        systemPrompt += `\n\nCURRENT USER MEMORY:
User's Business Name: ${currentUserContext.businessName || "Unknown"}
Industry/Type: ${currentUserContext.businessType || "E-commerce"}
Business Description: ${currentUserContext.businessDesc || "Not specified"}
Address the user with awareness of their specific business context when relevant.`;
      }

      const payload = {
        contents: [{
          parts: [{ text: `${systemPrompt}\n\nUser Question: ${prompt}` }]
        }]
      };

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
            let cleanText = data.candidates[0].content.parts[0].text;
            cleanText = cleanText.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");
            return cleanText;
        } else {
            return "Kernel error: Could not process neural response.";
        }
      } catch (error) {
        console.error("AI API error:", error);
        return "Connection to LaunchAxis Neural Core lost. Please check your network.";
      }
    }

    // Initialize memory on load
    initAxisMemory();
  </script>
</body>
</html>

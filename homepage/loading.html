<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kernel Initialization | LaunchAxis</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* =========================================
       LAUNCHAXIS CINEMATIC LOADER
       ========================================= */
    
    :root {
      --bg-dark: #050505;
      --card-bg: rgba(10, 10, 10, 0.6);
      --neon-cyan: #00f0ff;
      --neon-purple: #8B5CF6;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #FFFFFF;
      --text-muted: #888888;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      /* Subtle glowing background effect */
      background-image: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.1), transparent 60%);
    }

    .loader-container {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    /* The Glowing Orbit Core */
    .core-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .core-icon {
      font-size: 2rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
      z-index: 2;
    }

    .orbit-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed rgba(139, 92, 246, 0.5);
      animation: spin 6s linear infinite;
    }

    .orbit-ring::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      width: 8px;
      height: 8px;
      background: var(--neon-purple);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--neon-purple);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    /* Sleek Progress Bar */
    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 2rem;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan));
      border-radius: 10px;
      transition: width 0.5s ease-out;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
    }

    /* Terminal Log Window */
    .terminal-window {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      height: 110px;
      text-align: left;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .log-line {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
      opacity: 0.5;
      transform: translateY(10px);
      animation: slideUp 0.3s forwards;
    }

    .log-line.active {
      color: var(--neon-cyan);
      opacity: 1;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    .log-line i {
      margin-right: 8px;
      font-size: 0.7rem;
    }

    /* Keyframes */
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes slideUp { to { transform: translateY(0); } }

  </style>
</head>
<body>

  <div class="loader-container">
    <div class="core-wrapper">
      <div class="orbit-ring"></div>
      <i class="fa-solid fa-microchip core-icon"></i>
    </div>

    <h1>Architecting Workspace</h1>
    <p class="subtitle">Please wait while the AI Kernel builds your environment.</p>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="terminal-window" id="terminalWindow">
      </div>
  </div>

  <script type="module">
    // 1. Firebase Imports (These tell the code what initializeApp is)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    // 2. Your Firebase Config (Paste your keys here!)
    const firebaseConfig = {
        apiKey: "AIzaSyCgW3AW6wuebd8nde-Udenu-3X6hPbLkhY",
        authDomain: "launchaxis.firebaseapp.com",
        projectId: "launchaxis",
        storageBucket: "launchaxis.firebasestorage.app",
        messagingSenderId: "986994724231",
        appId: "1:986994724231:web:cf895161f7cf6c366a9722"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 3. UI Animation Setup
    const steps = [
        { text: "Authenticating LaunchAxis Kernel...", icon: "fa-solid fa-lock" },
        { text: "Analyzing startup parameters...", icon: "fa-solid fa-server" },
        { text: "Synthesizing neural brand identity...", icon: "fa-solid fa-wand-magic-sparkles" },
        { text: "Compiling dashboard architecture...", icon: "fa-solid fa-cubes" },
        { text: "Establishing secure database uplink...", icon: "fa-solid fa-network-wired" }
    ];

    let currentStep = 0;
    let isApiFinished = false; 
    const terminalWindow = document.getElementById("terminalWindow");
    const progressFill = document.getElementById("progressFill");

    // 4. The Animation Function
    function logNextStep() {
        if (isApiFinished) return; 

        if (currentStep < steps.length) {
            const previousLines = document.querySelectorAll('.log-line');
            previousLines.forEach(line => line.classList.remove('active'));

            const newLine = document.createElement("div");
            newLine.className = "log-line active";
            newLine.innerHTML = `<i class="${steps[currentStep].icon}"></i> ${steps[currentStep].text}`;
            terminalWindow.appendChild(newLine);

            const progressPercentage = ((currentStep + 1) / steps.length) * 90;
            progressFill.style.width = `${progressPercentage}%`;
            terminalWindow.scrollTop = terminalWindow.scrollHeight;

            currentStep++;
            const nextDelay = Math.random() * 1000 + 1000;
            setTimeout(logNextStep, nextDelay);
        }
    }

    // 5. The Real API Engine
    async function executeLaunchAxisKernel() {
        try {
            // Grab data
            const rawData = localStorage.getItem("launchAxisTempData");
            if (!rawData) throw new Error("No startup data found.");
            const userData = JSON.parse(rawData);

            // Define your AI inputs (Paste Gemini Key here!)
            const geminiApiKey = "AQ.Ab8RN6L7T6tsHQTA6tdWldvN-Tn8tEBizhZcP0QYdp28YbYLbg";
            const systemPrompt = "You are a professional business architect. Return ONLY valid JSON containing: businessName, tagline, targetAudience, and colorPalette (primary, secondary, accent hex codes).";
            const promptText = `Generate a business plan for: ${userData.businessName}. Description: ${userData.businessDesc}. Type: ${userData.businessType}.`;

            const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`;
            // Fire the API Request
            const response = await fetch(geminiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: systemPrompt + "\n\n" + promptText }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            if (!response.ok) throw new Error(`API rejected: ${response.status}`);

            const apiData = await response.json();
            const generatedJSON = JSON.parse(apiData.candidates[0].content.parts[0].text);

            // Merge Data
            const finalDashboardData = {
                ...userData,
                aiArchitecture: generatedJSON,
                createdAt: serverTimestamp()
            };

            // Save to Firebase
            await setDoc(doc(db, "users", userData.email), finalDashboardData);

            // Success Handling
            isApiFinished = true;
            progressFill.style.width = `100%`;
            
            const successLine = document.createElement("div");
            successLine.className = "log-line active";
            successLine.innerHTML = `<i class="fa-solid fa-check-double"></i> Kernel Execution Complete. Redirecting to Dashboard...`;
            successLine.style.color = "#10B981";
            terminalWindow.appendChild(successLine);

            setTimeout(() => {
                window.location.href = "http://localhost:3000/admin";
            }, 1500);

        } catch (error) {
            console.error("Kernel Failure:", error);
            alert("LaunchAxis Kernel encountered an error. Check console.");
        }
    }

    // Start the system
    setTimeout(logNextStep, 500);
    console.log("Kernel Ignition Sequence Started...");
    executeLaunchAxisKernel();
</script>

</body>
</html>

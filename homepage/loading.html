<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kernel Initialization | LaunchAxis</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: rgba(10, 10, 14, 0.7);
      --neon-cyan: #2dd4bf;
      --neon-purple: #8B5CF6;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #FFFFFF;
      --text-muted: #94a3b8;
    }

    body {
      margin: 0; font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark); color: var(--text-main);
      display: flex; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden;
    }

    .space-ambient-glow { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.1), transparent 60%); z-index: -1; }
    .cosmic-dust-overlay { position: fixed; inset: 0; background-image: radial-gradient(#ffffff 1px, transparent 1px); background-size: 50px 50px; opacity: 0.03; z-index: -1; }

    .loader-container {
      background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color); border-radius: 20px;
      padding: 3rem 2.5rem; width: 100%; max-width: 450px; text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    /* CSS Rocket Animation */
    .rocket-container { position: relative; width: 100px; height: 120px; margin: 0 auto 2rem; animation: floatY 2s ease-in-out infinite; }
    @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -0.5px; }
    p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; font-weight: 500;}

    /* Progress Bar */
    .progress-track {
      width: 100%; height: 6px; background: #0f172a; border-radius: 10px;
      overflow: hidden; margin-bottom: 2rem; position: relative; border: 1px solid #1e293b;
    }
    .progress-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan));
      border-radius: 10px; transition: width 0.5s ease-out; box-shadow: 0 0 15px rgba(45, 212, 191, 0.5);
    }

    /* Terminal Window */
    .terminal-window {
      background: #020617; border: 1px solid #1e293b; border-radius: 10px;
      padding: 1rem; height: 120px; text-align: left; overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .log-line {
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #475569;
      margin-top: 8px; opacity: 0.5; transform: translateY(10px); animation: slideUp 0.3s forwards;
    }
    .log-line.active { color: var(--neon-cyan); opacity: 1; text-shadow: 0 0 8px rgba(45, 212, 191, 0.4); }
    .log-line i { margin-right: 8px; font-size: 0.7rem; }
    @keyframes slideUp { to { transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="space-ambient-glow"></div>
  <div class="cosmic-dust-overlay"></div>

  <div class="loader-container">
    <!-- Visual CSS Rocket -->
    <div class="rocket-container">
      <svg width="100%" height="100%" viewBox="0 0 120 180" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0px 10px 15px rgba(45, 212, 191, 0.3));">
        <path d="M50 150 Q60 185 70 150 Z" fill="#2dd4bf" />
        <path d="M40 100 L10 140 L40 140 Z" fill="#94a3b8" />
        <path d="M80 100 L110 140 L80 140 Z" fill="#94a3b8" />
        <path d="M60 10 C30 50 40 150 40 150 L80 150 C80 150 90 50 60 10 Z" fill="#f8fafc" />
        <circle cx="60" cy="70" r="14" fill="#030712" stroke="#2dd4bf" stroke-width="4" />
      </svg>
    </div>

    <h1>Architecting Workspace</h1>
    <p class="subtitle">Axis AI is building your infrastructure.</p>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="terminal-window" id="terminalWindow"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCgW3AW6wuebd8nde-Udenu-3X6hPbLkhY",
        authDomain: "launchaxis.firebaseapp.com",
        projectId: "launchaxis",
        storageBucket: "launchaxis.firebasestorage.app",
        messagingSenderId: "986994724231",
        appId: "1:986994724231:web:cf895161f7cf6c366a9722"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const steps = [
        { text: "Authenticating LaunchAxis Kernel...", icon: "fa-solid fa-lock" },
        { text: "Analyzing founder parameters...", icon: "fa-solid fa-server" },
        { text: "Synthesizing brand & typography...", icon: "fa-solid fa-wand-magic-sparkles" },
        { text: "Compiling dashboard architecture...", icon: "fa-solid fa-cubes" },
        { text: "Establishing secure database uplink...", icon: "fa-solid fa-network-wired" }
    ];

    let currentStep = 0;
    let isApiFinished = false; 
    const terminalWindow = document.getElementById("terminalWindow");
    const progressFill = document.getElementById("progressFill");

    function logNextStep() {
        if (isApiFinished) return; 

        if (currentStep < steps.length) {
            const previousLines = document.querySelectorAll('.log-line');
            previousLines.forEach(line => line.classList.remove('active'));

            const newLine = document.createElement("div");
            newLine.className = "log-line active";
            newLine.innerHTML = `<i class="${steps[currentStep].icon}"></i> ${steps[currentStep].text}`;
            terminalWindow.appendChild(newLine);

            const progressPercentage = ((currentStep + 1) / steps.length) * 90;
            progressFill.style.width = `${progressPercentage}%`;
            terminalWindow.scrollTop = terminalWindow.scrollHeight;

            currentStep++;
            setTimeout(logNextStep, Math.random() * 1000 + 1000);
        }
    }

    async function executeLaunchAxisKernel() {
        try {
            const rawData = localStorage.getItem("launchAxisTempData");
            if (!rawData) throw new Error("No startup data found.");
            const userData = JSON.parse(rawData);
            
            const systemPrompt = `You are a strict JSON data generator for a SaaS platform. Return ONLY valid JSON. Do not include markdown \`\`\` wrappers. 
            Format requirements:
            {
              "businessName": "Generate a modern brand name if user provided 'Auto-Generate', otherwise use their input",
              "tagline": "A punchy 5-word marketing slogan based on their description",
              "targetAudience": "Detailed 1-sentence demographic target",
              "colorPalette": {
                "primary": "#HexCode (match industry vibe)",
                "secondary": "#HexCode",
                "accent": "#HexCode"
              }
            }`;
            
            const promptText = `User Data -> Name: ${userData.businessName}. Description: ${userData.businessDesc}. Type: ${userData.businessType}. Founder Profile: ${userData.userType}. Generate the JSON structure.`;
            
            // --- SECURE VERCEL API CALL ---
            const response = await fetch('/api/gemini', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: systemPrompt + "\n\n" + promptText })
            });

            if (!response.ok) throw new Error(`API rejected request: HTTP ${response.status}`);
            const apiData = await response.json();
            
            let rawText = apiData.text;
            rawText = rawText.replace(/```json|```/g, '').trim();
            const aiGenerated = JSON.parse(rawText);

            const finalDatabaseEntry = {
                email: userData.email,
                businessType: userData.businessType,
                userType: userData.userType,
                features: userData.features,
                aiArchitecture: {
                    businessName: aiGenerated.businessName,
                    tagline: aiGenerated.tagline,
                    targetAudience: aiGenerated.targetAudience,
                    colorPalette: aiGenerated.colorPalette,
                    businessDesc: userData.businessDesc
                },
                createdAt: serverTimestamp()
            };

            await setDoc(doc(db, "users", userData.email), finalDatabaseEntry);

            isApiFinished = true;
            progressFill.style.width = `100%`;
            
            const successLine = document.createElement("div");
            successLine.className = "log-line active";
            successLine.innerHTML = `<i class="fa-solid fa-check-double"></i> Kernel Execution Complete. Redirecting...`;
            successLine.style.color = "#2dd4bf";
            terminalWindow.appendChild(successLine);

            setTimeout(() => {
                window.location.href = "/admin"; 
            }, 1500);

        } catch (error) {
            console.error("Kernel Failure:", error);
            alert("LaunchAxis Kernel encountered an error: " + error.message);
        }
    }

    setTimeout(logNextStep, 500);
    executeLaunchAxisKernel();
  </script>
</body>
</html>
